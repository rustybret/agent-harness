name: Sync Upstream

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to sync from"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - master

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --add remote.origin.fetch +refs/heads/*:refs/remotes/origin/*

      - name: Fetch upstream and all branches
        run: |
          git remote add upstream https://github.com/code-yeongyu/oh-my-openagent.git
          git fetch upstream
          git fetch origin
          echo "UPSTREAM_BRANCH=${{ inputs.upstream_branch || 'dev' }}" >> $GITHUB_ENV

      - name: Fast-forward dev to upstream/dev
        id: ff_dev
        run: |
          git checkout -B dev origin/dev
          # Detect if upstream batch includes workflow file changes
          # GITHUB_TOKEN cannot push .github/workflows/ files — requires a PAT with workflows scope.
          WORKFLOW_CHANGES=$(git diff origin/dev..upstream/${{ env.UPSTREAM_BRANCH }} --name-only | grep "^\.github/workflows/" || true)
          if [ -n "$WORKFLOW_CHANGES" ]; then
            echo "DEV_PUSH_STATUS=needs_manual" >> $GITHUB_ENV
            echo "::warning::Upstream has workflow file changes — GITHUB_TOKEN cannot push these."
            echo "Push manually from a machine with write credentials:"
            echo "  git fetch upstream && git push origin upstream/${{ env.UPSTREAM_BRANCH }}:dev"
            echo "Affected workflow files:"
            echo "$WORKFLOW_CHANGES"
          else
            git merge --ff-only upstream/${{ env.UPSTREAM_BRANCH }}
            git push origin dev
            echo "DEV_PUSH_STATUS=success" >> $GITHUB_ENV
            echo "DEV_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "dev fast-forwarded to upstream/${{ env.UPSTREAM_BRANCH }}"
          fi

      - name: Rebase fork/local onto new dev
        id: rebase
        if: env.DEV_PUSH_STATUS == 'success'
        run: |
          git checkout -B fork/local origin/fork/local
          if git rebase dev; then
            git push origin fork/local --force-with-lease
            echo "REBASE_STATUS=success" >> $GITHUB_ENV
            echo "fork/local rebased successfully onto dev"
          else
            echo "REBASE_STATUS=conflict" >> $GITHUB_ENV
            git rebase --abort || true
            echo "Rebase had conflicts - will open PR"
          fi

      - name: Create conflict PR
        if: env.REBASE_STATUS == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="fork/local-conflict-${DATE}"

          # Create a merge-based resolution branch
          git checkout -b "$BRANCH" fork/local
          git merge dev --no-edit --strategy-option=ours || true
          git push origin "$BRANCH"

          gh pr create \
            --base fork/local \
            --head "$BRANCH" \
            --title "chore(sync): resolve upstream rebase conflicts (${DATE})" \
            --body "Automated sync from upstream/${{ env.UPSTREAM_BRANCH }} hit rebase conflicts.

          ## What happened
          - \`dev\` was fast-forwarded to \`upstream/${{ env.UPSTREAM_BRANCH }}\` ✅
          - Rebase of \`fork/local\` onto new \`dev\` had conflicts ❌

          ## What to do
          1. Check out this branch: \`git checkout ${BRANCH}\`
          2. Resolve conflicts manually
          3. \`git add .\` then \`git rebase --continue\`
          4. Force-push to \`origin/fork/local\`
          5. Close this PR

          ## Upstream commits added to dev
          See the diff between old and new dev."

          echo "PR created for branch ${BRANCH}"
          exit 1

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Sync upstream status
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Syncs pristine upstream dev branch to origin/dev.
            - Rebases local customizations or opens a conflict PR.
          JOB_SUMMARY_NEXT: If conflicts occurred, follow the conflict PR instructions to resolve manually.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
